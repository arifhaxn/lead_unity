  <style>
    /* Pre-boot screen. The Flutter bundle is ~3 MB, so users genuinely wait
       here — and it is the only readable text a search crawler ever gets,
       because CanvasKit paints the real UI into a <canvas>. Removed as soon
       as Flutter mounts its first view (see the observer below). */
    #app-loading {
      position: fixed; inset: 0; z-index: 2147483647;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px; padding: 32px 24px; margin: 0;
      background: #0F172A; color: #E2E8F0;
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    #app-loading img { width: 76px; height: 76px; border-radius: 18px; }
    #app-loading h1 { margin: 6px 0 0; font-size: 26px; letter-spacing: -0.01em; color: #fff; }
    #app-loading p { margin: 0; max-width: 46ch; color: #94A3B8; }
    #app-loading ul {
      margin: 4px 0 0; padding: 0; list-style: none;
      max-width: 52ch; color: #94A3B8; font-size: 14px;
    }
    #app-loading li { display: inline; }
    #app-loading li:not(:last-child)::after { content: " · "; color: #475569; }
    #app-loading .spinner {
      margin-top: 10px; width: 26px; height: 26px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,.18); border-top-color: #10B981;
      animation: app-spin .9s linear infinite;
    }
    @keyframes app-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #app-loading .spinner { animation: none; } }
  </style>

<body>
  <div id="app-loading">

    <div class="spinner" role="status" aria-label="Loading LeadUnity"></div>
    <noscript>
      <p style="color:#F87171">
        LeadUnity needs JavaScript to run. Please enable JavaScript, or install
        the Android app.
      </p>
    </noscript>
  </div>

  <script>
    // Drop the pre-boot screen the moment Flutter mounts its view, so it never
    // sits on top of the running app.
    (function () {
      var el = document.getElementById('app-loading');
      if (!el) return;
      function done() { if (el && el.parentNode) { el.parentNode.removeChild(el); el = null; } }
      if (document.querySelector('flutter-view, flt-glass-pane')) return done();
      var obs = new MutationObserver(function () {
        if (document.querySelector('flutter-view, flt-glass-pane')) { obs.disconnect(); done(); }
      });
      obs.observe(document.body, { childList: true, subtree: true });
      // Safety net: never trap the user behind the splash if detection fails.
      setTimeout(function () { obs.disconnect(); done(); }, 20000);
    })();
  </script>
