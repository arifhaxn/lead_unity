  <style>
    /* Pre-boot splash. Deliberately mirrors lib/widgets/splash_screen.dart —
       same logo, same centring, same backgrounds — so the handover to Flutter
       is invisible rather than looking like a second screen.
       It also carries the only text a crawler can read: CanvasKit paints the
       real UI into a <canvas>, so without this the page has no indexable
       content at all. Removed the moment Flutter mounts (observer below).

       Colours track AppTheme exactly:
         light  scaffoldBackgroundColor = AppColors.surfaceAlt   #ECFDF5
         dark   scaffoldBackgroundColor = AppColors.nightSurface #0F172A
       Getting this wrong flashes dark->light on light-mode devices. */
    #app-loading {
      position: fixed; inset: 0; z-index: 2147483647;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 18px; padding: 32px 24px; margin: 0;
      background: #ECFDF5; color: #0F172A;
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      animation: app-fade .45s ease-out both;
    }
    #app-loading img { width: auto; height: 150px; }  /* matches splash_screen.dart */
    #app-loading h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.01em; }
    #app-loading p { margin: 0; max-width: 42ch; font-size: 15px; color: #475569; }
    @keyframes app-fade { from { opacity: 0 } to { opacity: 1 } }
    @media (prefers-color-scheme: dark) {
      #app-loading { background: #0F172A; color: #F1F5F9; }
      #app-loading p { color: #CBD5E1; }
    }
    @media (prefers-reduced-motion: reduce) { #app-loading { animation: none } }
  </style>
</head>
<body>
  <div id="app-loading">
    <img src="logo-mark.png" width="129" height="150" alt="LeadUnity logo">
    <h1>LeadUnity</h1>
    <p>The academic portal for thesis and project proposals.</p>
    <noscript>
      <p style="color:#DC2626">
        LeadUnity needs JavaScript to run. Please enable JavaScript, or install
        the Android app.
      </p>
    </noscript>
  </div>

  <script>
    // Drop the pre-boot screen the moment Flutter mounts its view, so it never
    // sits on top of the running app.
    (function () {
      var el = document.getElementById('app-loading');
      if (!el) return;
      function done() { if (el && el.parentNode) { el.parentNode.removeChild(el); el = null; } }
      if (document.querySelector('flutter-view, flt-glass-pane')) return done();
      var obs = new MutationObserver(function () {
        if (document.querySelector('flutter-view, flt-glass-pane')) { obs.disconnect(); done(); }
      });
      obs.observe(document.body, { childList: true, subtree: true });
      // Safety net: never trap the user behind the splash if detection fails.
      setTimeout(function () { obs.disconnect(); done(); }, 20000);
    })();
  </script>
